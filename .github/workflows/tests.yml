name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is offline by design: every external response is a recorded
      # fixture. Running it with no network proves that, rather than asserting
      # it in a README.
      - name: Run tests with networking disabled
        run: python -m pytest -q --no-network

      - name: Check the package imports cleanly
        run: python -c "import dissent.api.app"
